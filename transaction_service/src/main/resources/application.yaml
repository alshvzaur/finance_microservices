server:
  port: 8082
spring:
  application:
    name: transaction_service
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transaction_db_ms}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET}